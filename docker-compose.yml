version: "3.8"
services:
  bot:
    build: .
    image: trading-bot:latest
    container_name: trading_bot
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
      - ./config:/app/config:ro
      - ./backups:/app/backups
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "sh /app/docker/healthcheck.sh" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
