[loggers]
keys=root, bot, system

[handlers]
keys=rotating_file, console_handler

[formatters]
keys=standard

[formatter_standard]
format=%(asctime)s - %(levelname)s - %(name)s - %(message)s

[handler_rotating_file]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=standard
args=('logs/bot.log', 'a', 5000000, 5) 

[handler_console_handler]
class=StreamHandler
level=INFO
formatter=standard
args=(sys.stdout,)

[logger_root]
level=INFO
handlers=console_handler

[logger_bot]
level=INFO
handlers=rotating_file
qualname=bot
propagate=0

[logger_system]
level=INFO
handlers=rotating_file
qualname=system
propagate=0
